<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Discover — Shadow Fire Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#060d18">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shadow Fire Live">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="sfl-theme.css">
<style>
.search-page { max-width: 960px; margin: 0 auto; padding: 24px 20px 60px; }
.search-bar-wrap {
  display: flex; gap: 10px; align-items: center;
  margin-bottom: 24px;
}
.search-input-wrap {
  flex: 1; position: relative;
}
.search-icon {
  position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%);
  font-size: 16px; pointer-events: none;
  color: var(--sfl-text-muted);
}
.search-input {
  padding-left: 40px !important;
}
.search-clear {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%);
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(255,255,255,0.12);
  border: none; cursor: pointer; color: var(--sfl-text-muted);
  font-size: 12px; display: none;
  align-items: center; justify-content: center;
  transition: background 0.15s;
}
.search-clear.visible { display: flex; }
.search-clear:hover { background: rgba(255,255,255,0.2); }

/* Filter bar */
.search-filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.search-filter {
  padding: 6px 14px;
  border-radius: var(--sfl-r-full);
  background: var(--sfl-bg-card);
  border: 1px solid var(--sfl-border);
  color: var(--sfl-text-muted);
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  transition: background var(--sfl-t), border-color var(--sfl-t), color var(--sfl-t);
  white-space: nowrap;
}
.search-filter:hover { border-color: var(--sfl-border-hot); color: var(--sfl-text); }
.search-filter.active { background: var(--sfl-bg-active); border-color: var(--sfl-border-hot); color: var(--sfl-blue); }

/* Section heading */
.search-section-head { font-size: 13px; font-weight: 700; color: var(--sfl-text-label); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 12px; margin-top: 4px; }

/* Creator card row */
.creator-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin-bottom: 24px; }
.creator-row::-webkit-scrollbar { display: none; }
.creator-pill {
  flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center;
  gap: 6px; width: 90px;
  text-decoration: none; cursor: pointer;
  transition: transform var(--sfl-t);
}
.creator-pill:hover { transform: translateY(-2px); }
.creator-pill-avatar {
  width: 60px; height: 60px; border-radius: 50%;
  object-fit: cover; background: var(--sfl-bg-card);
  border: 2px solid var(--sfl-border);
  transition: border-color var(--sfl-t);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.creator-pill:hover .creator-pill-avatar { border-color: var(--sfl-border-hot); }
.creator-pill-name { font-size: 11px; font-weight: 600; color: var(--sfl-text-label); text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.creator-pill-subs { font-size: 10px; color: var(--sfl-text-faint); }
.creator-pill.is-live .creator-pill-avatar { border-color: var(--sfl-live); box-shadow: 0 0 10px rgba(255,34,68,0.4); }

/* No results */
.search-no-results { text-align: center; padding: 60px 20px; color: var(--sfl-text-muted); }
.search-no-results .icon { font-size: 40px; margin-bottom: 12px; opacity: 0.6; }

@media (max-width: 768px) {
  .search-page { padding: 16px 12px calc(58px + 16px); padding-top: calc(60px + 16px); }
}
</style>
</head>
<body class="sfl-body">
<div class="sfl-bg-layer"></div>
<div id="sfl-toast" role="status"></div>

<!-- Mobile top bar -->
<header class="sfl-topbar" aria-label="Top navigation">
  <div class="sfl-topbar-title">🔍 Discover</div>
  <div></div>
</header>

<!-- Desktop sidebar -->
<aside class="sfl-sidebar" aria-label="Main navigation">
  <div class="sfl-logo">
    <a href="sfl-home.html" style="text-decoration:none;">
      <div class="sfl-logo-text">🔥 SHADOW FIRE LIVE</div>
      <div class="sfl-logo-sub">Video · Live · Connect</div>
    </a>
  </div>
  <nav class="sfl-sidebar-nav">
    <a href="sfl-home.html"   class="sfl-nav-item"><span class="sfl-nav-icon">🏠</span> Home</a>
    <a href="sfl-search.html" class="sfl-nav-item active"><span class="sfl-nav-icon">🔍</span> Discover</a>
    <a href="live.html"       class="sfl-nav-item"><span class="sfl-nav-icon">📡</span> Live</a>
    <a href="sfl-upload.html" class="sfl-nav-item"><span class="sfl-nav-icon">📤</span> Upload</a>
    <a href="sfl-notifications.html" class="sfl-nav-item"><span class="sfl-nav-icon">🔔</span> Notifications</a>
    <a href="sfl-profile.html" class="sfl-nav-item"><span class="sfl-nav-icon">👤</span> Profile</a>
  </nav>
  <div class="sfl-sidebar-footer">
    <a href="sfl-settings.html" class="sfl-nav-item"><span class="sfl-nav-icon">⚙️</span> Settings</a>
  </div>
</aside>

<div class="sfl-layout">
  <main class="sfl-main" role="main">
    <div class="search-page">

      <!-- Search bar -->
      <div class="search-bar-wrap">
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input class="sfl-input search-input" id="searchInput" type="search"
            placeholder="Search videos, creators, tags…"
            autocomplete="off" autocorrect="off" spellcheck="false"
            aria-label="Search Shadow Fire Live">
          <button class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
        </div>
      </div>

      <!-- Filter pills -->
      <div class="search-filter-bar" role="group" aria-label="Search filter">
        <div class="search-filter active" data-filter="all">All</div>
        <div class="search-filter" data-filter="videos">🎬 Videos</div>
        <div class="search-filter" data-filter="creators">👤 Creators</div>
        <div class="search-filter" data-filter="live">📡 Live</div>
        <div class="search-filter" data-filter="gaming">🎮 Gaming</div>
        <div class="search-filter" data-filter="music">🎵 Music</div>
        <div class="search-filter" data-filter="art">🎨 Art</div>
        <div class="search-filter" data-filter="tech">💻 Tech</div>
      </div>

      <!-- Main results area -->
      <div id="searchResults">

        <!-- Default / trending state -->
        <div id="defaultView">
          <!-- Live creators -->
          <div id="liveCreatorsWrap">
            <div class="search-section-head">🔴 Live Right Now</div>
            <div class="sfl-live-row" id="liveCreatorRow">
              <div class="sfl-loader-wrap" id="liveCreatorsLoader">
                <div class="sfl-spinner" style="width:20px;height:20px;border-width:2px;"></div>
              </div>
            </div>
          </div>

          <!-- Trending videos -->
          <div style="margin-top:24px;">
            <div class="search-section-head">🔥 Trending</div>
            <div class="sfl-video-grid" id="trendingGrid">
              <div class="sfl-loader-wrap" id="trendingLoader" style="grid-column:1/-1;">
                <div class="sfl-spinner"></div>
              </div>
            </div>
          </div>

          <!-- Creators to follow -->
          <div style="margin-top:28px;" id="creatorsWrap">
            <div class="search-section-head">👤 Creators to Follow</div>
            <div class="creator-row" id="creatorsRow"></div>
          </div>
        </div>

        <!-- Search results -->
        <div id="queryResults" class="sfl-hidden">
          <!-- Results injected here -->
        </div>

      </div><!-- /searchResults -->

    </div>
  </main>
</div>

<!-- Mobile bottom nav -->
<nav class="sfl-bottom-nav" aria-label="Mobile navigation">
  <a href="sfl-home.html" class="sfl-bn-item"><span class="sfl-bn-icon">🏠</span><span>Home</span></a>
  <a href="sfl-search.html" class="sfl-bn-item active"><span class="sfl-bn-icon">🔍</span><span>Discover</span></a>
  <a href="sfl-upload.html" class="sfl-bn-item"><span class="sfl-bn-icon">📤</span><span>Upload</span></a>
  <a href="sfl-notifications.html" class="sfl-bn-item"><span class="sfl-bn-icon">🔔</span><span>Alerts</span></a>
  <a href="sfl-profile.html" class="sfl-bn-item"><span class="sfl-bn-icon">👤</span><span>Profile</span></a>
</nav>

<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {
  getFirestore, collection, query, where, orderBy, limit,
  getDocs, onSnapshot
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FIREBASE_CONFIG = {
  apiKey:'AIzaSyByZRmp6R9HY17T2_WdJUFWeeaLNOP6y2Y',
  authDomain:'horr-a08f4.firebaseapp.com',
  databaseURL:'https://horr-a08f4-default-rtdb.firebaseio.com',
  projectId:'horr-a08f4',
  storageBucket:'horr-a08f4.firebasestorage.app',
  messagingSenderId:'933810617818',
  appId:'1:933810617818:web:efb24f123337dd987c14e3'
};
const app  = getApps().length ? getApps()[0] : initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = id => document.getElementById(id);
const toast = (msg,dur=3000) => {
  const t=$('sfl-toast');t.textContent=msg;t.classList.add('visible');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('visible'),dur);
};

let _activeFilter = 'all';
let _searchTimer = null;
let _user = null;

function fmtNum(n){if(n>=1e6)return(n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(n>=1e3)return(n/1e3).toFixed(1).replace(/\.0$/,'')+'K';return String(n||0);}
function timeAgo(ts){if(!ts)return'';const d=ts.toDate?ts.toDate():new Date(ts);const s=(Date.now()-d.getTime())/1000;if(s<60)return'just now';if(s<3600)return`${Math.floor(s/60)}m ago`;if(s<86400)return`${Math.floor(s/3600)}h ago`;return`${Math.floor(s/86400)}d ago`;}
function fmtTime(s){if(!s)return'';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;if(h)return`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;return`${m}:${String(sec).padStart(2,'0')}`;}

/* ── Load default trending ── */
async function loadDefault() {
  loadLiveCreators();
  loadTrending();
  loadCreators();
}

async function loadLiveCreators() {
  const row    = $('liveCreatorRow');
  const loader = $('liveCreatorsLoader');
  try {
    const q = query(
      collection(db,'liveRooms'),
      where('status','==','live'),
      orderBy('viewerCount','desc'), limit(10)
    );
    onSnapshot(q, snap => {
      row.innerHTML = '';
      if(snap.empty) {
        $('liveCreatorsWrap').style.display = 'none';
        return;
      }
      $('liveCreatorsWrap').style.display = '';
      snap.docs.forEach(d => {
        const data = d.data();
        const a = document.createElement('a');
        a.href = `live.html?room=${d.id}`;
        a.className = 'sfl-live-card';
        a.innerHTML = `
          <div class="sfl-live-thumb">
            <div class="sfl-live-thumb-placeholder">📡</div>
            <div class="sfl-live-badge">LIVE</div>
            <div class="sfl-live-viewers">👁 ${fmtNum(data.viewerCount||0)}</div>
          </div>
          <div class="sfl-live-info">
            <div class="sfl-live-info-row">
              ${data.hostAvatar ? `<img src="${data.hostAvatar}" class="sfl-live-avatar" alt="" loading="lazy">` : `<div class="sfl-live-avatar" style="font-size:12px;display:flex;align-items:center;justify-content:center;">👤</div>`}
              <span class="sfl-live-creator sfl-truncate">${data.hostName||'Creator'}</span>
            </div>
            <div class="sfl-live-title">${data.title||'Live stream'}</div>
            ${data.category ? `<div class="sfl-live-category">${data.category}</div>` : ''}
          </div>
        `;
        row.appendChild(a);
      });
    });
  } catch(e) { $('liveCreatorsWrap').style.display = 'none'; }
}

async function loadTrending() {
  const grid   = $('trendingGrid');
  const loader = $('trendingLoader');
  try {
    const q = query(
      collection(db,'videos'),
      where('visibility','==','public'),
      orderBy('views','desc'), limit(20)
    );
    const snap = await getDocs(q);
    loader.classList.add('sfl-hidden');
    grid.innerHTML = '';
    snap.docs.forEach(d => grid.appendChild(buildVideoCard(d.id, d.data())));
    if(snap.empty) grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--sfl-text-muted);padding:24px;">No videos yet.</div>';
  } catch(e) { loader.classList.add('sfl-hidden'); }
}

async function loadCreators() {
  const row = $('creatorsRow');
  try {
    const q = query(
      collection(db,'users'),
      orderBy('followerCount','desc'), limit(20)
    );
    const snap = await getDocs(q);
    if(snap.empty) { $('creatorsWrap').style.display='none'; return; }
    snap.docs.forEach(d => {
      const data = d.data();
      const a = document.createElement('a');
      a.href = `sfl-profile.html?uid=${d.id}`;
      a.className = `creator-pill${data.isLive ? ' is-live' : ''}`;
      const avatarEl = data.avatar
        ? `<img src="${data.avatar}" class="creator-pill-avatar" alt="" loading="lazy">`
        : `<div class="creator-pill-avatar">👤</div>`;
      a.innerHTML = `
        ${avatarEl}
        <div class="creator-pill-name">${data.displayName || data.username || 'User'}</div>
        <div class="creator-pill-subs">${fmtNum(data.followerCount||0)}</div>
      `;
      row.appendChild(a);
    });
  } catch(e) { $('creatorsWrap').style.display='none'; }
}

/* ── Video card builder ── */
function buildVideoCard(id, data) {
  const a = document.createElement('a');
  a.href  = `sfl-player.html?v=${id}`;
  a.className = 'sfl-video-card sfl-fade-up';
  const thumb = data.thumbnailUrl
    ? `<img src="${data.thumbnailUrl}" alt="${data.title||''}" loading="lazy">`
    : `<div class="sfl-video-thumb-placeholder">🎬</div>`;
  const dur = data.duration ? `<div class="sfl-video-duration">${fmtTime(data.duration)}</div>` : '';
  a.innerHTML = `
    <div class="sfl-video-thumb">
      ${thumb}
      <div class="sfl-video-play-overlay"><div class="sfl-video-play-btn">▶</div></div>
      ${dur}
    </div>
    <div class="sfl-video-info">
      ${data.creatorAvatar ? `<img src="${data.creatorAvatar}" class="sfl-video-creator-avatar sfl-avatar sfl-avatar-sm" alt="" loading="lazy">` : `<div class="sfl-video-creator-avatar sfl-avatar sfl-avatar-sm" style="display:flex;align-items:center;justify-content:center;font-size:12px;">👤</div>`}
      <div class="sfl-video-meta">
        <div class="sfl-video-title">${data.title||'Untitled'}</div>
        <div class="sfl-video-creator-name sfl-truncate">${data.creatorName||''}</div>
        <div class="sfl-video-stats">
          <span>${fmtNum(data.views||0)} views</span>
          <span>${timeAgo(data.createdAt)}</span>
        </div>
      </div>
    </div>
  `;
  return a;
}

/* ── Search ── */
async function runSearch(query_text, filter) {
  $('defaultView').classList.add('sfl-hidden');
  $('queryResults').classList.remove('sfl-hidden');
  const container = $('queryResults');
  container.innerHTML = '<div class="sfl-loader-wrap" style="padding:40px;"><div class="sfl-spinner"></div></div>';

  if(!query_text.trim()) {
    $('defaultView').classList.remove('sfl-hidden');
    $('queryResults').classList.add('sfl-hidden');
    return;
  }

  try {
    const q_lower = query_text.toLowerCase();
    let html = '';

    // Search videos by title prefix (Firestore doesn't support full text search natively
    // so we use range queries as approximation)
    if(filter === 'all' || filter === 'videos' || (!['creators','live'].includes(filter))) {
      const q = query(
        collection(db,'videos'),
        where('visibility','==','public'),
        orderBy('title'),
        where('title','>=',query_text),
        where('title','<=',query_text + '\uf8ff'),
        limit(30)
      );
      const snap = await getDocs(q);
      // Also search by tag if not many results
      let docs = snap.docs;
      if(docs.length < 5) {
        const q2 = query(
          collection(db,'videos'),
          where('visibility','==','public'),
          where('tags','array-contains',q_lower),
          orderBy('views','desc'), limit(20)
        );
        try {
          const snap2 = await getDocs(q2);
          snap2.docs.forEach(d => { if(!docs.find(x=>x.id===d.id)) docs.push(d); });
        } catch(e2) {}
      }
      if(docs.length) {
        const gridId = `videoResultGrid_${Date.now()}`;
        html += `<div class="search-section-head" style="margin-top:8px;">🎬 Videos (${docs.length})</div><div class="sfl-video-grid" id="${gridId}"></div>`;
        container.innerHTML = html;
        const grid = document.getElementById(gridId);
        if(grid) docs.forEach(d => grid.appendChild(buildVideoCard(d.id, d.data())));
        html = container.innerHTML;
      }
    }

    // Search creators
    if(filter === 'all' || filter === 'creators') {
      const q = query(
        collection(db,'users'),
        orderBy('displayName'),
        where('displayName','>=',query_text),
        where('displayName','<=',query_text + '\uf8ff'),
        limit(15)
      );
      const snap = await getDocs(q);
      if(!snap.empty) {
        let crHtml = `<div class="search-section-head" style="margin-top:20px;">👤 Creators</div><div class="creator-row">`;
        snap.docs.forEach(d => {
          const data = d.data();
          const avatarEl = data.avatar
            ? `<img src="${data.avatar}" class="creator-pill-avatar" alt="" loading="lazy">`
            : `<div class="creator-pill-avatar">👤</div>`;
          crHtml += `<a href="sfl-profile.html?uid=${d.id}" class="creator-pill${data.isLive ? ' is-live' : ''}">
            ${avatarEl}
            <div class="creator-pill-name">${data.displayName||data.username||'User'}</div>
            <div class="creator-pill-subs">${fmtNum(data.followerCount||0)}</div>
          </a>`;
        });
        crHtml += '</div>';
        container.innerHTML += crHtml;
      }
    }

    // Live streams
    if(filter === 'all' || filter === 'live') {
      const q = query(
        collection(db,'liveRooms'),
        where('status','==','live'),
        limit(15)
      );
      const snap = await getDocs(q);
      const liveMatches = snap.docs.filter(d => {
        const data = d.data();
        return !query_text || (data.title||'').toLowerCase().includes(q_lower) || (data.hostName||'').toLowerCase().includes(q_lower);
      });
      if(liveMatches.length) {
        container.innerHTML += `<div class="search-section-head" style="margin-top:20px;">📡 Live Streams</div><div class="sfl-live-row" id="liveSearchRow"></div>`;
        const row = container.querySelector('#liveSearchRow');
        if(row) liveMatches.forEach(d => {
          const data = d.data();
          const a = document.createElement('a');
          a.href = `live.html?room=${d.id}`;
          a.className = 'sfl-live-card';
          a.innerHTML = `<div class="sfl-live-thumb"><div class="sfl-live-thumb-placeholder">📡</div><div class="sfl-live-badge">LIVE</div><div class="sfl-live-viewers">👁 ${fmtNum(data.viewerCount||0)}</div></div><div class="sfl-live-info"><div class="sfl-live-title">${data.title||'Live'}</div><div class="sfl-live-creator">${data.hostName||''}</div></div>`;
          row.appendChild(a);
        });
      }
    }

    if(!container.innerHTML || container.innerHTML.includes('sfl-spinner')) {
      container.innerHTML = `<div class="search-no-results"><div class="icon">🔍</div><div style="font-size:16px;font-weight:700;margin-bottom:6px;">No results for "${query_text}"</div><div style="font-size:13px;">Try a different search term or browse trending content.</div></div>`;
    }
  } catch(e) {
    console.error('Search error:', e);
    container.innerHTML = `<div class="search-no-results"><div class="icon">⚠️</div><div style="font-size:14px;">Search failed. Please try again.</div></div>`;
  }
}

/* ── Search input handlers ── */
$('searchInput').addEventListener('input', () => {
  const val = $('searchInput').value;
  $('searchClear').classList.toggle('visible', !!val);
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => runSearch(val, _activeFilter), 400);
});
$('searchClear').addEventListener('click', () => {
  $('searchInput').value = '';
  $('searchClear').classList.remove('visible');
  $('defaultView').classList.remove('sfl-hidden');
  $('queryResults').classList.add('sfl-hidden');
});

/* ── Filter pills ── */
document.querySelectorAll('.search-filter').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.search-filter').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    _activeFilter = pill.dataset.filter;
    const q = $('searchInput').value;
    if(q) runSearch(q, _activeFilter);
    else {
      $('defaultView').classList.remove('sfl-hidden');
      $('queryResults').classList.add('sfl-hidden');
    }
  });
});

/* ── Pre-fill from URL ── */
const urlQ = new URLSearchParams(location.search).get('q');
if(urlQ) {
  $('searchInput').value = urlQ;
  $('searchClear').classList.add('visible');
  runSearch(urlQ, 'all');
}

onAuthStateChanged(auth, u => { _user = u; });
loadDefault();
</script>

<script src="pwa-install.js" defer></script>
</body>
</html>
